# `docker compose up --build` starts the whole stack (API on :8000).
# For local development with `uv run`, start only the infrastructure:
#   docker compose up -d postgres redis minio minio-setup

# Shared by the api, worker and migrate services. Values from .env (e.g. LLM_API_KEY) are
# loaded when the file exists; hostnames are overridden to point at the other containers.
x-app: &app
  build: .
  image: docs-extraction:latest
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docs}:${POSTGRES_PASSWORD:-docs}@postgres:5432/${POSTGRES_DB:-docs_extraction}
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: minio:9000
    LOG_FORMAT: json
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docs}
      POSTGRES_DB: ${POSTGRES_DB:-docs_extraction}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO no longer publishes community images to Docker Hub/Quay; Chainguard's free
  # rebuild is used instead (only the :latest tag is free).
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MC_HOST_local: http://${S3_ACCESS_KEY:-minioadmin}:${S3_SECRET_KEY:-minioadmin}@localhost:9000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job that creates the bucket, then exits.
  minio-setup:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_minio: http://${S3_ACCESS_KEY:-minioadmin}:${S3_SECRET_KEY:-minioadmin}@minio:9000
    command: ["mb", "--ignore-existing", "minio/${S3_BUCKET:-documents}"]

  # Applies database migrations once, before the API and worker start.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on: &app-dependencies
      migrate:
        condition: service_completed_successfully
      minio-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    healthcheck:
      disable: true
    depends_on: *app-dependencies

volumes:
  postgres_data:
  minio_data:
